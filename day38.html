<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch with DOM</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101820;
        --panel: #182a35;
        --border: #31505b;
        --text: #eaeaea;
        --muted: #a0a0b0;
        --accent: #4ecca3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #101820, #203b43);
        color: var(--text);
        font-family: Georgia, serif;
      }

      main {
        width: min(760px, 100%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 5vw, 3rem);
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      section {
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 18px 40px rgb(0 0 0 / 25%);
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 4px;
        background: var(--accent);
        color: #10231f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.1);
      }

      #f3display {
        min-height: 32px;
        margin-top: 20px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fetch with DOM</h1>
      <p>Live Data Display</p>

      <section>
        <button id="f3loadBtn" type="button">Load Members</button>
        <div id="f3display" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="thefetch.js"></script>
  </body>
</html>
