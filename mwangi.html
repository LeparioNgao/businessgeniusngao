<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mwangi Farm Milk Records</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #edf4e8;
        --muted: #aab9a5;
        --background: #111b17;
        --panel: #1b2a22;
        --line: #3b5847;
        --accent: #d6e86a;
        --accent-ink: #1a2618;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 20px;
        color: var(--ink);
        background: radial-gradient(circle at top right, #304c3a, var(--background) 52%);
        font-family: Georgia, serif;
      }

      main { width: min(900px, 100%); margin: 0 auto; }

      header { margin-bottom: 24px; }
      h1 { margin: 0 0 6px; font-size: clamp(2rem, 5vw, 3.5rem); }
      header p { margin: 0; color: var(--muted); }

      section {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgb(27 42 34 / 90%);
        box-shadow: 0 20px 45px rgb(0 0 0 / 25%);
      }

      button {
        padding: 11px 17px;
        border: 0;
        border-radius: 4px;
        color: var(--accent-ink);
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { filter: brightness(1.08); }
      #farmDisplay { margin-top: 22px; }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }

      .summary div {
        padding: 14px;
        border-left: 3px solid var(--accent);
        background: #24372b;
      }

      .summary strong, .summary span { display: block; }
      .summary strong { font-size: 1.35rem; }
      .summary span { margin-top: 4px; color: var(--muted); font-size: 0.9rem; }

      .table-wrap { max-height: 520px; overflow: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
      th { position: sticky; top: 0; color: var(--accent); background: #263c2e; }
      td { color: var(--muted); }
      td:first-child { color: var(--ink); font-weight: 700; }

      @media (max-width: 560px) {
        body { padding: 22px 12px; }
        section { padding: 16px; }
        .summary { grid-template-columns: 1fr; }
        th, td { padding: 9px 7px; font-size: 0.9rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Mwangi Farm</h1>
        <p>Weekly milk production records for 40 cows</p>
      </header>

      <section>
        <button id="loadFarmData" type="button">Load Milk Records</button>
        <div id="farmDisplay" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="mwangifarm.js"></script>
  </body>
</html>
