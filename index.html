<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Demo</title>
  </head>
  <body>
    <div id="d1target" class="d1item">SMP Performance Board</div>
    <div class="d1item">Member: Brian Otieno</div>
    <div class="d1item">Member: Wanjiku Muthoni</div>
    <div class="d1item">Member: Kamau Njoroge</div>

    <div id="d2panel"></div>

    <div id="event-demo" style="margin-top: 24px; max-width: 420px; font-family: sans-serif;">
      <h3>Event Log Demo</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input id="d3input" type="text" placeholder="Type a task" style="flex: 1; padding: 8px;" />
        <button id="d3addBtn" type="button">Add</button>
        <button id="d3clearBtn" type="button">Clear</button>
      </div>
      <div id="d3count">Entries: 0</div>
      <ul id="d3list" style="list-style: none; padding-left: 0; margin-top: 12px;"></ul>
    </div>

    <div id="smp-checkin" style="margin-top: 32px; max-width: 420px; font-family: sans-serif;">
      <h3>SMP Daily Check-in</h3>
      <form id="d4form">
        <div style="margin-bottom: 10px;">
          <label for="d4name">Name</label><br />
          <input id="d4name" type="text" placeholder="Enter name" style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 10px;">
          <label for="d4sleep">Sleep (hours)</label><br />
          <input id="d4sleep" type="number" step="0.1" placeholder="7.5" style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 10px;">
          <label for="d4water">Water (gl)</label><br />
          <input id="d4water" type="number" placeholder="8" style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 10px;">
          <label for="d4steps">Steps</label><br />
          <input id="d4steps" type="number" placeholder="12000" style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <button type="submit">Submit Check-in</button>
      </form>

      <p id="d4result" style="margin-top: 12px; font-weight: 600;"></p>
    </div>

    <script src="dommanipulation_events.js"></script>
  </body>
</html>
